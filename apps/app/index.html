<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="preload" href="/fonts/HelveticaNowText-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/HelveticaNowText-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/HelveticaNowDisplay-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/HelveticaNowDisplay-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenDiff</title>
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        // Signed-out pages are always dark (see SIGNED_OUT_PATH_PREFIXES in src/main.tsx)
        var signedOut = /^\/(login|auth\/callback|invite\/)/.test(window.location.pathname);
        if (signedOut || theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
