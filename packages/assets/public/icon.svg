<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1500">
  <!-- Matches the Icon component: the --yellow token as the square with the mark inverted on it.
       Light: near-black square (oklch(0.175 0 0) ≈ #101010), white mark. Dark: white square, black mark. -->
  <style>
    .square { fill: #101010; }
    .mark { fill: #fff; }
    @media (prefers-color-scheme: dark) {
      .square { fill: #fff; }
      .mark { fill: #000; }
    }
  </style>
  <rect class="square" width="1500" height="1500"/>
  <path class="mark" d="M750 0L1125 375L750 750L1125 1125L750 1500L0 750Z"/>
</svg>
