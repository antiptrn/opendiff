services:
  bff:
    build:
      context: .
      dockerfile: Dockerfile
      target: bff
    ports:
      - "3001:3001"
    env_file: apps/bff/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${GITHUB_PRIVATE_KEY_PATH:?Set GITHUB_PRIVATE_KEY_PATH}:${GITHUB_PRIVATE_KEY_PATH:?Set GITHUB_PRIVATE_KEY_PATH}:ro
    labels:
      app: opendiff-prod
    init: true
    mem_limit: 512m
    restart: unless-stopped

  site:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        PACKAGE: site
    ports:
      - "5173:8080"
    labels:
      app: opendiff-prod
    mem_limit: 128m
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        PACKAGE: app
    ports:
      - "5174:8080"
    labels:
      app: opendiff-prod
    mem_limit: 128m
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent
    ports:
      - "3000:3000"
    env_file: apps/review-agent/.env
    environment:
      GITHUB_PRIVATE_KEY_PATH: ${GITHUB_PRIVATE_KEY_PATH:?Set GITHUB_PRIVATE_KEY_PATH}
      OPENCODE_REASONING_EFFORT: medium
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${GITHUB_PRIVATE_KEY_PATH:?Set GITHUB_PRIVATE_KEY_PATH}:${GITHUB_PRIVATE_KEY_PATH:?Set GITHUB_PRIVATE_KEY_PATH}:ro
      - /home/j/.local/share/opencode/auth.json:/tmp/opencode-auth/auth.json:ro
    labels:
      app: opendiff-prod
    init: true
    mem_limit: 512m
    restart: unless-stopped
